name: Keep n8n Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -s "https://n8n-satyam.onrender.com/healthz"

      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
